name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job only checks out the repo and runs npm checks —
# none write to the repo, post comments, or deploy. Read-only contents is enough.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:links
      - name: Bundle size gate
        run: |
          BUDGET_KB=100
          TOTAL=$(find dist/_astro -name '*.js' -exec cat {} + 2>/dev/null | gzip -c | wc -c)
          TOTAL_KB=$((TOTAL / 1024))
          echo "Client JS (gzipped, all pages combined): ${TOTAL_KB} KB (budget: ${BUDGET_KB} KB)"
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Client JS budget exceeded"
            exit 1
          fi

  # Mechanical guards so *new* duplication fails CI instead of relying on review;
  # enforces the "Don't duplicate" rules in AGENTS.md. jscpd and the constant-literal
  # grep gate are blocking; stylelint and knip run warn-only for a rollout period
  # (continue-on-error) before being promoted to blocking once clean.
  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Copy-paste detector (jscpd, blocking)
        run: npm run check:dup

      - name: No physical-constant literals in content or islands (blocking)
        run: |
          # Physical constants live only in src/lib/physics/constants.ts (AGENTS.md).
          # Flag their signatures — scientific-notation floats (e.g. 6.626e-34) and the
          # bare speed of light — leaking into page content or island source. Prose
          # mentions like "299,792,458 m/s" (comma-grouped, explanatory) are allowed.
          if grep -rnE '[0-9]\.[0-9]+[eE][-+]?[0-9]+|(^|[^0-9,])299792458([^0-9]|$)' src/content src/components; then
            echo "::error::Physical-constant literal found in content/island. Import it from src/lib/physics/constants.ts instead."
            exit 1
          fi
          echo "No physical-constant literals in content or islands."

      - name: CSS lint + token discipline (stylelint, warn-only)
        continue-on-error: true
        run: npm run check:styles

      - name: Dead-export detection (knip, warn-only)
        continue-on-error: true
        run: npm run check:knip

  # Static analysis: cyclomatic/cognitive complexity + duplication (ESLint) and
  # test-coverage thresholds (Vitest). Kept as a distinct job so a complexity or
  # coverage failure is visibly separate from the type/test/build/link job above.
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Complexity & lint (ESLint)
        run: npm run lint
      - name: Test coverage thresholds (Vitest)
        run: |
          if ! npm run coverage; then
            echo "::error::Coverage below threshold — see the summary above for the metric and target (thresholds in vitest.config.ts)."
            exit 1
          fi

  # Security: fail the build on a known-vulnerable dependency (npm advisory DB).
  # Kept as its own job so a dependency CVE is visibly separate from the type/test/
  # build and static-analysis jobs. Complements Dependabot by blocking a PR that
  # pulls in a high-severity advisory before it reaches main.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (high+ severity, blocking)
        run: npm audit --audit-level=high
