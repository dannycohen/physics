# Proactive dependency and Actions version updates. Reactive security updates
# (Dependabot alerts + security PRs) are already enabled repo-side; this adds
# routine updates so deps and pinned Actions stay current before a CVE lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
